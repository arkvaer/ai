<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sidebar-w: 280px;
      --accent: #4f6ef7;
      --accent-hover: #3b5de7;
      --sidebar-bg: #f3f4f6;
      --main-bg: #ffffff;
      --user-bubble: #f0f0f5;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.06);
    }

    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; color: var(--text-primary); background: var(--main-bg); }

    .app { display: flex; height: 100%; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100%;
      background: var(--sidebar-bg); display: flex; flex-direction: column;
      border-right: 1px solid var(--border); transition: margin-left .25s ease;
    }
    .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }

    .sidebar-header {
      padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
    }
    .sidebar-header h1 { font-size: 18px; font-weight: 700; }
    .sidebar-toggle {
      display: none; width: 32px; height: 32px; border: none; background: none;
      cursor: pointer; font-size: 20px; color: var(--text-secondary); border-radius: 6px;
    }
    .sidebar-toggle:hover { background: var(--border); }

    .new-chat-btn {
      margin: 0 12px 12px; padding: 10px 16px; border: 1px solid var(--border);
      border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px;
      color: var(--text-primary); transition: all .15s; display: flex; align-items: center; gap: 6px;
    }
    .new-chat-btn:hover { background: #e8e8ed; }

    .conversation-list {
      flex: 1; overflow-y: auto; padding: 0 8px;
    }
    .conversation-list::-webkit-scrollbar { width: 4px; }
    .conversation-list::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .conv-item {
      padding: 10px 14px; margin: 2px 0; border-radius: 8px; cursor: pointer;
      font-size: 13px; color: var(--text-primary); display: flex; align-items: center;
      justify-content: space-between; gap: 8px; transition: background .15s;
    }
    .conv-item:hover { background: #e5e7eb; }
    .conv-item.active { background: #dbeafe; font-weight: 500; }
    .conv-item .title {
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .conv-item .delete-btn {
      width: 22px; height: 22px; border: none; background: none; cursor: pointer;
      font-size: 14px; color: var(--text-secondary); border-radius: 4px;
      display: none; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .conv-item:hover .delete-btn { display: flex; }
    .conv-item .delete-btn:hover { background: #fca5a5; color: #dc2626; }

    .sidebar-footer {
      padding: 12px 20px; border-top: 1px solid var(--border);
      font-size: 12px; color: var(--text-secondary);
    }

    /* Main */
    .main {
      flex: 1; display: flex; flex-direction: column; height: 100%; min-width: 0;
    }

    .main-header {
      padding: 12px 20px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--border); background: #fff;
    }
    .main-header .menu-btn {
      width: 32px; height: 32px; border: none; background: none; cursor: pointer;
      font-size: 20px; color: var(--text-secondary); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
    }
    .main-header .menu-btn:hover { background: var(--border); }
    .main-header .model-badge {
      font-size: 13px; font-weight: 500; padding: 4px 10px; border-radius: 12px;
      background: #eef2ff; color: var(--accent);
    }

    .messages-container { flex: 1; overflow-y: auto; }
    .messages-container::-webkit-scrollbar { width: 4px; }
    .messages-container::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }

    .messages {
      max-width: 800px; margin: 0 auto; padding: 24px 20px;
      display: flex; flex-direction: column; gap: 20px;
    }

    /* Welcome */
    .welcome {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 80px 20px; gap: 12px;
    }
    .welcome-icon { font-size: 48px; margin-bottom: 8px; }
    .welcome h2 { font-size: 22px; font-weight: 600; }
    .welcome p { color: var(--text-secondary); font-size: 15px; max-width: 500px; line-height: 1.6; }

    /* Message bubbles */
    .message { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .message.user { align-self: flex-end; }
    .message.assistant { align-self: flex-start; }

    .message .role-label {
      font-size: 12px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px;
    }
    .message.user .role-label { text-align: right; }

    .message .content {
      padding: 10px 16px; border-radius: var(--radius); font-size: 15px; line-height: 1.65;
      word-break: break-word;
    }
    .message.user .content { background: var(--user-bubble); }
    .message.assistant .content { background: transparent; padding-left: 0; padding-right: 0; }

    .message .content p { margin: 0 0 8px; }
    .message .content p:last-child { margin-bottom: 0; }
    .message .content ul, .message .content ol { margin: 8px 0; padding-left: 24px; }
    .message .content li { margin: 4px 0; }
    .message .content pre {
      background: #1e1e1e; color: #d4d4d4; border-radius: 8px; padding: 14px 16px;
      overflow-x: auto; margin: 10px 0; font-size: 13px; line-height: 1.5;
    }
    .message .content code {
      font-family: "JetBrains Mono", "Fira Code", monospace; font-size: .88em;
    }
    .message .content :not(pre) > code {
      background: #f3f4f6; padding: 2px 6px; border-radius: 4px; color: #e11d48;
    }
    .message .content pre code { background: none; padding: 0; color: inherit; }
    .message .content table { border-collapse: collapse; margin: 10px 0; width: 100%; }
    .message .content th, .message .content td {
      border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 14px;
    }
    .message .content th { background: #f9fafb; font-weight: 600; }
    .message .content blockquote {
      border-left: 3px solid var(--accent); padding-left: 14px; margin: 10px 0;
      color: var(--text-secondary);
    }
    .message .content a { color: var(--accent); text-decoration: none; }
    .message .content a:hover { text-decoration: underline; }

    .message .meta {
      display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px;
      color: var(--text-secondary);
    }
    .message.user .meta { justify-content: flex-end; }

    .copy-btn {
      border: none; background: none; cursor: pointer; color: var(--text-secondary);
      font-size: 12px; padding: 2px 6px; border-radius: 4px; opacity: 0;
      transition: opacity .15s, background .15s;
    }
    .message:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { background: var(--border); }
    .copy-btn.copied { color: #16a34a; }

    /* Typing indicator */
    .typing-indicator {
      display: flex; gap: 4px; padding: 8px 0; align-self: flex-start;
    }
    .typing-indicator span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-secondary);
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input */
    .input-container {
      padding: 16px 20px 20px; border-top: 1px solid var(--border); background: #fff;
    }
    .input-wrapper {
      max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end;
      gap: 8px; background: #f4f4f5; border: 1px solid var(--border);
      border-radius: 16px; padding: 6px 6px 6px 16px; transition: border-color .15s;
    }
    .input-wrapper:focus-within { border-color: var(--accent); background: #fff; }

    .input-wrapper textarea {
      flex: 1; border: none; background: transparent; outline: none; resize: none;
      font-size: 15px; font-family: inherit; color: var(--text-primary);
      line-height: 1.5; padding: 6px 0; max-height: 160px;
    }
    .input-wrapper textarea::placeholder { color: #9ca3af; }

    .send-btn {
      width: 34px; height: 34px; border: none; border-radius: 10px;
      background: var(--accent); color: #fff; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background .15s, opacity .15s;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:disabled { opacity: .4; cursor: not-allowed; }

    .input-hint { text-align: center; font-size: 11px; color: #9ca3af; margin-top: 8px; }

    /* Responsive */
    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; z-index: 100; height: 100%;
        box-shadow: 2px 0 8px rgba(0,0,0,.1); }
      .sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
      .sidebar-toggle { display: flex; }
      .messages { padding: 16px 12px; }
      .message { max-width: 92%; }
    }
    @media (min-width: 769px) {
      .main-header .menu-btn { display: none; }
    }

    /* Empty state */
    .empty-conversations {
      padding: 24px 16px; text-align: center; color: var(--text-secondary); font-size: 13px;
    }
  </style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1>AI Chat</h1>
      <button class="sidebar-toggle" onclick="toggleSidebar()" title="关闭侧栏">✕</button>
    </div>
    <button class="new-chat-btn" onclick="newConversation()">
      <span>+</span> 新对话
    </button>
    <div class="conversation-list" id="conversationList"></div>
    <div class="sidebar-footer">Powered by Qwen Plus</div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-header">
      <button class="menu-btn" onclick="toggleSidebar()" title="打开侧栏">☰</button>
      <span class="model-badge">Qwen Plus</span>
    </div>

    <div class="messages-container" id="messagesContainer">
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon">✨</div>
          <h2>有什么可以帮助你的？</h2>
          <p>基于通义千问大语言模型，支持流式对话、Markdown 渲染和代码高亮</p>
        </div>
      </div>
    </div>

    <div class="input-container">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="发送消息..." rows="1" onkeydown="handleKeyDown(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
      </div>
      <div class="input-hint">Enter 发送，Shift+Enter 换行</div>
    </div>
  </main>
</div>

<script>
  marked.setOptions({
    breaks: true,
    gfm: true,
    highlight: function(code, lang) {
      if (lang && hljs.getLanguage(lang)) {
        return hljs.highlight(code, { language: lang }).value;
      }
      return hljs.highlightAuto(code).value;
    }
  });

  const STORAGE_KEY = 'ai_chat_conversations';
  const ACTIVE_KEY = 'ai_chat_active';

  let conversations = loadConversations();
  let activeId = localStorage.getItem(ACTIVE_KEY);
  let isStreaming = false;

  const sidebar = document.getElementById('sidebar');
  const conversationList = document.getElementById('conversationList');
  const messagesEl = document.getElementById('messages');
  const messagesContainer = document.getElementById('messagesContainer');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  // --- Data ---
  function loadConversations() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveConversations() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
  }

  function getActiveConversation() {
    return conversations.find(c => c.id === activeId) || null;
  }

  function ensureActiveConversation() {
    if (getActiveConversation()) return;
    const conv = { id: Date.now().toString(36), title: '新对话', messages: [], createdAt: Date.now() };
    conversations.unshift(conv);
    activeId = conv.id;
    localStorage.setItem(ACTIVE_KEY, activeId);
    saveConversations();
  }

  // --- Sidebar ---
  function renderSidebar() {
    if (conversations.length === 0) {
      conversationList.innerHTML = '<div class="empty-conversations">暂无对话记录</div>';
      return;
    }
    conversationList.innerHTML = conversations.map(c => `
      <div class="conv-item${c.id === activeId ? ' active' : ''}" onclick="switchConversation('${c.id}')">
        <span class="title">${escapeHtml(c.title)}</span>
        <button class="delete-btn" onclick="event.stopPropagation(); deleteConversation('${c.id}')" title="删除">×</button>
      </div>
    `).join('');
  }

  function switchConversation(id) {
    activeId = id;
    localStorage.setItem(ACTIVE_KEY, activeId);
    renderSidebar();
    renderMessages();
  }

  function newConversation() {
    if (isStreaming) return;
    const conv = { id: Date.now().toString(36), title: '新对话', messages: [], createdAt: Date.now() };
    conversations.unshift(conv);
    activeId = conv.id;
    localStorage.setItem(ACTIVE_KEY, activeId);
    saveConversations();
    renderSidebar();
    renderMessages();
    userInput.focus();
  }

  function deleteConversation(id) {
    conversations = conversations.filter(c => c.id !== id);
    if (activeId === id) {
      activeId = conversations.length > 0 ? conversations[0].id : null;
      localStorage.setItem(ACTIVE_KEY, activeId || '');
    }
    saveConversations();
    renderSidebar();
    renderMessages();
  }

  // --- Messages ---
  function renderMessages() {
    const conv = getActiveConversation();
    if (!conv || conv.messages.length === 0) {
      messagesEl.innerHTML = `
        <div class="welcome">
          <div class="welcome-icon">✨</div>
          <h2>有什么可以帮助你的？</h2>
          <p>基于通义千问大语言模型，支持流式对话、Markdown 渲染和代码高亮</p>
        </div>`;
      scrollToBottom();
      return;
    }
    messagesEl.innerHTML = conv.messages.map((m, i) => `
      <div class="message ${m.role}">
        <div class="role-label">${m.role === 'user' ? '你' : 'AI'}</div>
        <div class="content">${m.role === 'user' ? escapeHtml(m.content) : marked.parse(m.content)}</div>
        <div class="meta">
          ${m.role === 'assistant' ? `<button class="copy-btn" onclick="copyMessage(${i})">复制</button>` : ''}
          <span>${formatTime(m.time)}</span>
        </div>
      </div>
    `).join('');
    scrollToBottom();
  }

  function addMessage(role, content) {
    const conv = getActiveConversation();
    if (!conv) return;
    conv.messages.push({ role, content, time: Date.now() });
    if (conv.title === '新对话' && role === 'user') {
      conv.title = content.slice(0, 30) + (content.length > 30 ? '...' : '');
    }
    saveConversations();
  }

  function updateLastAssistant(content) {
    const conv = getActiveConversation();
    if (!conv) return;
    const msgs = conv.messages;
    if (msgs.length > 0 && msgs[msgs.length - 1].role === 'assistant') {
      msgs[msgs.length - 1].content = content;
    } else {
      msgs.push({ role: 'assistant', content, time: Date.now() });
    }
    saveConversations();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
  }

  // --- Streaming ---
  async function sendMessage() {
    const question = userInput.value.trim();
    if (!question || isStreaming) return;

    isStreaming = true;
    userInput.value = '';
    autoResize();
    updateSendButton();

    // Remove welcome if present
    const welcome = messagesEl.querySelector('.welcome');
    if (welcome) welcome.remove();

    ensureActiveConversation();

    // Add user message
    addMessage('user', question);
    renderMessages();
    renderSidebar();

    // Add empty assistant message
    addMessage('assistant', '');
    renderMessages();

    // Create streaming element
    const assistantMsg = messagesEl.querySelector('.message.assistant:last-of-type .content');
    let fullContent = '';

    try {
      const url = `chat/qwenClient?question=${encodeURIComponent(question)}`;
      const response = await fetch(url, { headers: { 'Accept': 'text/event-stream' } });

      if (!response.ok) throw new Error(`HTTP ${response.status}`);

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split('\n');
        buffer = lines.pop() || '';

        for (const line of lines) {
          let text = '';
          if (line.startsWith('data:')) {
            text = line.slice(5);
            // Trim single leading space (SSE spec allows one space after colon)
            if (text.startsWith(' ')) text = text.slice(1);
          } else if (line.trim() !== '') {
            // Non-SSE fallback: raw text line
            text = line;
          }
          if (text && text !== '[DONE]') {
            fullContent += text;
            assistantMsg.innerHTML = marked.parse(fullContent);
            scrollToBottom();
          }
        }
      }

      // Process remaining buffer
      if (buffer.trim()) {
        let text = buffer;
        if (text.startsWith('data:')) {
          text = text.slice(5);
          if (text.startsWith(' ')) text = text.slice(1);
        }
        if (text && text !== '[DONE]') {
          fullContent += text;
        }
      }

    } catch (err) {
      fullContent += `\n\n> ⚠️ 请求失败: ${escapeHtml(err.message)}`;
    }

    updateLastAssistant(fullContent);
    renderMessages();
    renderSidebar();
    isStreaming = false;
    updateSendButton();
    userInput.focus();
  }

  // --- Input ---
  function handleKeyDown(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize() {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 160) + 'px';
  }

  function updateSendButton() {
    sendBtn.disabled = isStreaming || userInput.value.trim() === '';
  }

  // --- Actions ---
  function copyMessage(index) {
    const conv = getActiveConversation();
    if (!conv) return;
    const content = conv.messages[index].content;
    navigator.clipboard.writeText(content).then(() => {
      const btns = messagesEl.querySelectorAll('.copy-btn');
      if (btns[index]) {
        btns[index].textContent = '已复制';
        btns[index].classList.add('copied');
        setTimeout(() => {
          btns[index].textContent = '复制';
          btns[index].classList.remove('copied');
        }, 1500);
      }
    });
  }

  function toggleSidebar() {
    sidebar.classList.toggle('collapsed');
  }

  // --- Utils ---
  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (d.toDateString() === now.toDateString()) return time;
    return `${d.getMonth() + 1}/${d.getDate()} ${time}`;
  }

  // --- Init ---
  userInput.addEventListener('input', () => {
    autoResize();
    updateSendButton();
  });

  renderSidebar();
  if (activeId && getActiveConversation()) {
    renderMessages();
  }
  userInput.focus();
</script>
</body>
</html>
