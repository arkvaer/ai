server:
  port: 8082
  servlet:
    context-path: /ollama
    encoding:
      enabled: true
      force: true
      charset: UTF-8

spring:
  application:
    name: ollama
  ai:
    dashscope:
      agent:
        api-key: ${AI_DASHSCOPE_API_KEY}
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen3:4b